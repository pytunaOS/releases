name: Build pytunaOS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select the version:"
        required: true
        type: choice
        options:
          - beta
          - development
          - stable
        default: beta

jobs:
  build:
    name: Building pytunaOS
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: pytunaOS/profile
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: profile

      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          repository: pytunaOS/repository
          ref: main
          fetch-depth: 1
          path: repository

      - name: Set release information
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(date -u +'%Y.%m.%d')"
          BRANCH="${{ inputs.branch }}"

          case "$BRANCH" in
            stable)
              PREFIX="stable"
              ;;
            development)
              PREFIX="dev"
              ;;
            beta)
              PREFIX="beta"
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          RELEASE_DIRECTORY="${PREFIX}-${VERSION}"
          IA_IDENTIFIER="pytunaos-${PREFIX}-${VERSION//./-}-x86_64-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_DIRECTORY=${RELEASE_DIRECTORY}" >> "$GITHUB_ENV"
          echo "IA_IDENTIFIER=${IA_IDENTIFIER}" >> "$GITHUB_ENV"

      - name: Pull Arch Linux container
        run: docker pull archlinux:latest

      - name: Build ISO
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            -v "${{ github.workspace }}/profile:/work" \
            -v "${{ github.workspace }}/repository/x86_64:/pytuna-repository:ro" \
            archlinux:latest \
            bash -c '
              set -euo pipefail

              pacman-key --init
              pacman-key --populate archlinux

              # pytuna repository
              pacman-key \
                --recv-key D4FE3B0C197EF8C6 \
                --keyserver hkps://keyserver.ubuntu.com

              pacman-key --lsign-key D4FE3B0C197EF8C6

              KEYRING_PACKAGE="$(
                find /pytuna-repository \
                  -maxdepth 1 \
                  -type f \
                  -name "pytuna-keyring-*.pkg.tar.zst" |
                  sort -V |
                  tail -n 1
              )"

              MIRRORLIST_PACKAGE="$(
                find /pytuna-repository \
                  -maxdepth 1 \
                  -type f \
                  -name "pytuna-mirrorlist-*.pkg.tar.zst" |
                  sort -V |
                  tail -n 1
              )"

              if [ -z "$KEYRING_PACKAGE" ]; then
                echo "ERRO: pacote pytuna-keyring não encontrado no repositório"
                exit 1
              fi

              if [ -z "$MIRRORLIST_PACKAGE" ]; then
                echo "ERRO: pacote pytuna-mirrorlist não encontrado no repositório"
                exit 1
              fi

              echo "Instalando bootstrap: $(basename "$KEYRING_PACKAGE")"
              pacman -U --noconfirm "$KEYRING_PACKAGE"

              echo "Instalando bootstrap: $(basename "$MIRRORLIST_PACKAGE")"
              pacman -U --noconfirm "$MIRRORLIST_PACKAGE"

              printf "\n[pytuna]\n" >> /etc/pacman.conf
              printf "Include = /etc/pacman.d/pytuna-mirrorlist\n" \
                >> /etc/pacman.conf

              # chaotic-aur repository
              pacman-key \
                --recv-key 3056513887B78AEB \
                --keyserver hkps://keyserver.ubuntu.com

              pacman-key --lsign-key 3056513887B78AEB

              pacman -U \
                "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst" \
                --noconfirm

              pacman -U \
                "https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst" \
                --noconfirm

              printf "\n[chaotic-aur]\n" >> /etc/pacman.conf
              printf "Include = /etc/pacman.d/chaotic-mirrorlist\n" \
                >> /etc/pacman.conf

              pacman -Syu --noconfirm
              pacman -S --noconfirm archiso git grub

              cd /work
              mkdir -p iso

              mkarchiso \
                -v \
                -r \
                -w /tmp/pytuna \
                -o iso \
                .

              cd iso
              sha256sum -- *.iso > SHA256SUMS
            '

      - name: Verify and prepare upload files
        shell: bash
        run: |
          set -euo pipefail

          ISO_DIRECTORY="${{ github.workspace }}/profile/iso"

          shopt -s nullglob
          ISO_FILES=("${ISO_DIRECTORY}"/*.iso)

          if (( ${#ISO_FILES[@]} == 0 )); then
            echo "No ISO file was generated."
            exit 1
          fi

          test -s "${ISO_DIRECTORY}/SHA256SUMS"

          (
            cd "$ISO_DIRECTORY"
            sha256sum --check SHA256SUMS
          )

          UPLOAD_DIRECTORY="${RUNNER_TEMP}/release-upload"
          mkdir -p "$UPLOAD_DIRECTORY"

          cp -- "${ISO_FILES[@]}" "$UPLOAD_DIRECTORY/"
          cp -- \
            "${ISO_DIRECTORY}/SHA256SUMS" \
            "$UPLOAD_DIRECTORY/"

          echo "UPLOAD_DIRECTORY=${UPLOAD_DIRECTORY}" >> "$GITHUB_ENV"

          echo "Files ready for upload:"
          ls -lh "$UPLOAD_DIRECTORY"

      - name: Configure SourceForge SSH
        shell: bash
        env:
          SOURCEFORGE_SSH_PRIVATE_KEY: ${{ secrets.SOURCEFORGE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SOURCEFORGE_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/pytunaos_sourceforge"

          chmod 600 "$HOME/.ssh/pytunaos_sourceforge"

          ssh-keyscan -H frs.sourceforge.net \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create SourceForge release directory
        shell: bash
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          set -euo pipefail

          REMOTE_DIRECTORY="/home/frs/project/pytunaos-iso-releases/${RELEASE_DIRECTORY}"

          printf '%s\n' \
            "-mkdir ${REMOTE_DIRECTORY}" \
            "quit" |
            sftp \
              -b - \
              -i "$HOME/.ssh/pytunaos_sourceforge" \
              -o IdentitiesOnly=yes \
              "${SOURCEFORGE_USERNAME}@frs.sourceforge.net"

      - name: Upload ISO to SourceForge
        shell: bash
        env:
          SOURCEFORGE_USERNAME: ${{ secrets.SOURCEFORGE_USERNAME }}
        run: |
          set -euo pipefail

          REMOTE_DIRECTORY="/home/frs/project/pytunaos-iso-releases/${RELEASE_DIRECTORY}/"

          rsync \
            --archive \
            --verbose \
            --partial \
            --append-verify \
            --progress \
            --delete-after \
            -e "ssh -i $HOME/.ssh/pytunaos_sourceforge -o IdentitiesOnly=yes" \
            "${UPLOAD_DIRECTORY}/" \
            "${SOURCEFORGE_USERNAME}@frs.sourceforge.net:${REMOTE_DIRECTORY}"

          echo "Upload completed:"
          echo "https://sourceforge.net/projects/pytunaos-iso-releases/files/${RELEASE_DIRECTORY}/"

      - name: Upload ISO to Internet Archive
        timeout-minutes: 180
        shell: bash
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          IA_VENV="${RUNNER_TEMP}/internetarchive-venv"
          python3 -m venv "$IA_VENV"
          "$IA_VENV/bin/python" -m pip install --upgrade pip internetarchive

          shopt -s nullglob
          IA_FILES=("${UPLOAD_DIRECTORY}"/*.iso "${UPLOAD_DIRECTORY}/SHA256SUMS")

          if (( ${#IA_FILES[@]} < 2 )); then
            echo "ISO or SHA256SUMS not found in ${UPLOAD_DIRECTORY}."
            exit 1
          fi

          IA_DATE="${VERSION//./-}"

          "$IA_VENV/bin/ia" upload "$IA_IDENTIFIER" \
            --status-check

          "$IA_VENV/bin/ia" upload "$IA_IDENTIFIER" \
            "${IA_FILES[@]}" \
            --metadata="title:pytunaOS ${VERSION} (${{ inputs.branch }})" \
            --metadata="creator:pytunaOS Project" \
            --metadata="date:${IA_DATE}" \
            --metadata="mediatype:software" \
            --metadata="collection:open_source_software" \
            --metadata="description:Official pytunaOS ${{ inputs.branch }} x86_64 installation image." \
            --metadata="subject:pytunaOS" \
            --metadata="subject:Linux" \
            --metadata="subject:Arch Linux" \
            --metadata="subject:Operating System" \
            --retries 10 \
            --checksum

          echo "Internet Archive upload completed:"
          echo "https://archive.org/details/${IA_IDENTIFIER}"

          for ISO_PATH in "${UPLOAD_DIRECTORY}"/*.iso; do
            ISO_FILE="$(basename "$ISO_PATH")"
            echo "https://archive.org/download/${IA_IDENTIFIER}/${ISO_FILE}"
          done
